<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMOS 단어장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="lib/html2pdf.bundle.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" data-go="home">
      <span class="logo">LUMOS</span>
      <span class="brand-sub">English Academy · 단어장</span>
    </div>
    <nav class="tabs">
      <button data-go="home" class="tab">단어장 목록</button>
      <button data-go="test" class="tab">시험지 만들기</button>
      <button data-go="backup" class="tab">백업</button>

  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>

  <div id="pdf-stage" aria-hidden="true"></div>
  <div id="toast"></div>

  <script src="app.js"></script>
